<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>준비 중입니다</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #fbf9f5;
    color: #6b625a;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    text-align: center;
    padding: 24px;
    line-height: 2;
  }
  .mark { width: 30px; height: 1px; background: #ddd5c9; margin: 0 auto 26px; }
  p { margin: 0; font-size: 14px; letter-spacing: .02em; }
  .sub { margin-top: 10px; font-size: 12.5px; color: #a2988c; }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <p>준비 중입니다.</p>
    <p class="sub">조금만 기다려 주세요.</p>
  </main>
</body>
</html>
