<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>박남규 ♥ 염지수 결혼합니다</title>
<meta name="description" content="노블발렌티 삼성에서 저희의 시작을 함께해 주세요." />
<meta name="theme-color" content="#f7f4ef" />
<!-- 검색엔진 노출 차단: 주소를 아는 하객만 들어오게 한다 -->
<meta name="robots" content="noindex, nofollow, noarchive" />

<!-- Open Graph (카카오톡 / 메신저 공유 미리보기) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="박남규 ♥ 염지수 결혼합니다" />
<meta property="og:description" content="노블발렌티 삼성에서 저희의 시작을 함께해 주세요." />
<meta property="og:image" content="images/hero.svg" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">

  <!-- ============ 1. HERO ============ -->
  <header class="hero">
    <div class="hero__media">
      <img src="images/hero.svg" alt="박남규 염지수 웨딩 사진" />
      <div class="hero__scrim"></div>
    </div>

    <div class="hero__content">
      <p class="hero__eyebrow">WE ARE GETTING MARRIED</p>
      <h1 class="hero__names">
        <span>박남규</span>
        <span class="hero__amp">&amp;</span>
        <span>염지수</span>
      </h1>
      <div class="hero__rule"></div>
      <p class="hero__date" data-hero-date></p>
      <p class="hero__venue" data-hero-venue></p>
    </div>

    <div class="hero__scroll" aria-hidden="true"><span></span></div>
  </header>

  <main>

    <!-- ============ 2. 인사말 ============ -->
    <section class="section section--invite reveal">
      <p class="section__label">INVITATION</p>
      <h2 class="section__title">초대합니다</h2>

      <p class="invite__poem" data-invite-poem></p>
      <div class="ornament" aria-hidden="true">
        <span></span><i>♥</i><span></span>
      </div>
      <p class="invite__body" data-invite-body></p>

      <div class="invite__parents" data-invite-parents></div>
    </section>

    <!-- ============ 3. 연락하기 ============ -->
    <section class="section section--contact reveal">
      <p class="section__label">CONTACT</p>
      <h2 class="section__title">연락하기</h2>
      <div class="contact" data-contact></div>
    </section>

    <!-- ============ 4. 예식 안내 (달력 + D-day) ============ -->
    <section class="section section--date reveal">
      <p class="section__label">SAVE THE DATE</p>
      <h2 class="section__title" data-date-title></h2>
      <p class="section__sub" data-date-sub></p>

      <div class="calendar" data-calendar></div>
      <p class="dday" data-dday></p>
    </section>

    <!-- ============ 5. 갤러리 ============ -->
    <section class="section section--gallery reveal">
      <p class="section__label">GALLERY</p>
      <h2 class="section__title">우리의 순간</h2>
      <div class="gallery" data-gallery></div>
    </section>

    <!-- ============ 6. 오시는 길 ============ -->
    <section class="section section--location reveal">
      <p class="section__label">LOCATION</p>
      <h2 class="section__title">오시는 길</h2>

      <p class="location__name" data-venue-name></p>
      <p class="location__addr" data-venue-addr></p>

      <div class="map" data-map></div>

      <div class="map__links" data-map-links></div>

      <div class="transport" data-transport></div>
    </section>

    <!-- ============ 7. 마음 전하실 곳 ============ -->
    <section class="section section--account reveal">
      <p class="section__label">GIFT</p>
      <h2 class="section__title">마음 전하실 곳</h2>
      <p class="account__note">
        참석이 어려우신 분들을 위해 계좌번호를 남깁니다.<br />
        너그러운 마음으로 양해 부탁드립니다.
      </p>
      <div class="accordion" data-accounts></div>
    </section>

    <!-- ============ 8. 공유하기 ============ -->
    <section class="section section--share reveal">
      <div class="share" data-share></div>
    </section>

  </main>

  <footer class="footer">
    <p class="footer__names">박남규 &nbsp;·&nbsp; 염지수</p>
    <p class="footer__thanks">감사합니다</p>
  </footer>

</div>

<!-- 갤러리 라이트박스 -->
<div class="lightbox" data-lightbox hidden>
  <button class="lightbox__close" data-lb-close aria-label="닫기">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" data-lb-prev aria-label="이전 사진">&#8249;</button>
  <img class="lightbox__img" data-lb-img alt="" />
  <button class="lightbox__nav lightbox__nav--next" data-lb-next aria-label="다음 사진">&#8250;</button>
  <p class="lightbox__count" data-lb-count></p>
</div>

<!-- 복사 완료 토스트 -->
<div class="toast" data-toast></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
